<!doctype html><html lang="en"><meta charset="utf-8"><title>Studio responsive verification</title><style>body{margin:20px;background:#e7e9e2;font:16px system-ui}button{padding:12px;margin:5px}iframe{display:block;height:850px;background:white;border:1px solid #aaa;max-width:none}label{display:block;margin:12px 0}</style><h1>Responsive test viewport</h1><p>This is a development test harness, not a student learning page.</p><button data-width="390">Mobile · 390</button><button data-width="768">Tablet · 768</button><button data-width="1366">Laptop · 1366</button><button data-width="320">Narrow · 320</button><label for="route">Page<select id="route"><option value="home">Home</option><option value="plan">Plan</option><option value="vocabulary">Vocabulary</option><option value="practice">Practice</option><option value="develop">Develop</option><option value="draft">Draft</option><option value="progress">Progress</option><option value="reference">Reference</option><option value="teacher">Teacher</option></select></label><iframe id="studio" title="Writing studio test viewport" src="../index.html#home" style="width:390px"></iframe><script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>document.getElementById('studio').style.width=b.dataset.width+'px');document.getElementById('route').onchange=e=>document.getElementById('studio').src='../index.html#'+e.target.value;</script></html>
